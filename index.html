<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#02040b">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>M POPAL • EARTH 360°</title>

<style>
/* =========================================================
   M POPAL EARTH 360°
   SINGLE FILE EDITION
   NO THREE.JS
   NO WEBGL
   NO CDN
   NO EXTERNAL FILE
========================================================= */

:root{
    --bg0:#010208;
    --bg1:#020817;
    --bg2:#06172a;

    --cyan:#00eaff;
    --blue:#238bff;
    --violet:#9b5cff;
    --pink:#ff4fd8;
    --green:#36f1a1;
    --gold:#ffd166;
    --white:#ffffff;

    --glass:rgba(4,10,22,.76);
    --glass2:rgba(255,255,255,.055);

    --edge:rgba(255,255,255,.92);
    --soft:rgba(255,255,255,.18);

    --shadow:
        0 0 30px rgba(0,234,255,.10);

    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#010208;
    color:white;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    touch-action:none;
}

button,
input{
    font:inherit;
}

button{
    color:white;
    border:0;
    outline:0;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    isolation:isolate;

    background:
        radial-gradient(
            circle at 50% 46%,
            #0d2948 0%,
            #07162a 20%,
            #030914 47%,
            #010208 82%,
            #000105 100%
        );
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.starLayer{
    position:absolute;
    inset:-10%;
    background-image:
        radial-gradient(circle,
            rgba(255,255,255,.9) 0 1px,
            transparent 1.5px),
        radial-gradient(circle,
            rgba(0,234,255,.85) 0 1px,
            transparent 1.5px),
        radial-gradient(circle,
            rgba(255,79,216,.8) 0 1px,
            transparent 1.5px),
        radial-gradient(circle,
            rgba(255,209,102,.8) 0 1px,
            transparent 1.5px);

    background-size:
        93px 93px,
        147px 147px,
        211px 211px,
        263px 263px;

    background-position:
        0 0,
        31px 72px,
        90px 25px,
        120px 110px;

    opacity:.55;

    animation:
        starsMove 25s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translate3d(0,0,0);
    }
    to{
        transform:translate3d(-45px,25px,0);
    }
}

.nebula{
    position:absolute;
    width:80vmax;
    height:80vmax;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,234,255,.10) 0%,
            rgba(35,139,255,.055) 27%,
            rgba(155,92,255,.035) 47%,
            transparent 70%
        );

    filter:blur(35px);

    animation:
        nebulaPulse 8s ease-in-out infinite alternate;
}

@keyframes nebulaPulse{
    from{
        opacity:.55;
        transform:translate(-50%,-50%) scale(.88);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.10);
    }
}

/* =========================================================
   TOP HEADER
========================================================= */

.topbar{
    position:absolute;
    z-index:100;

    top:0;
    left:0;
    right:0;

    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        12px
        14px;

    pointer-events:none;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    pointer-events:auto;
}

.brandLogo{
    width:47px;
    height:47px;

    display:grid;
    place-items:center;

    border-radius:15px;

    border:
        1.5px solid
        rgba(255,255,255,.95);

    background:
        linear-gradient(
            135deg,
            rgba(0,234,255,.22),
            rgba(35,139,255,.15),
            rgba(155,92,255,.20),
            rgba(255,79,216,.12)
        );

    box-shadow:
        0 0 18px rgba(0,234,255,.17),
        inset 0 0 15px rgba(255,255,255,.04);
}

.brandLogo span{
    font-size:23px;
}

.brandTitle{
    font-size:15px;
    font-weight:800;
    letter-spacing:2.5px;
}

.brandSub{
    margin-top:4px;

    color:#8395ae;

    font-size:8px;
    letter-spacing:2px;
}

.topActions{
    display:flex;
    gap:8px;

    pointer-events:auto;
}

.topButton{
    width:44px;
    height:44px;

    border-radius:14px;

    border:
        1.4px solid
        rgba(255,255,255,.85);

    background:
        rgba(2,8,18,.72);

    backdrop-filter:blur(16px);

    box-shadow:
        0 0 16px rgba(0,234,255,.05);

    font-size:18px;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.topButton:hover{
    border-color:#fff;
    background:rgba(255,255,255,.09);
}

.topButton:active{
    transform:scale(.91);
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:absolute;
    z-index:80;

    top:86px;
    left:50%;

    transform:translateX(-50%);

    padding:
        7px
        13px;

    border-radius:30px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(2,8,18,.62);

    backdrop-filter:blur(14px);

    color:#b9c8da;

    font-size:8px;
    letter-spacing:1.5px;

    white-space:nowrap;
}

.statusDot{
    display:inline-block;

    width:6px;
    height:6px;

    margin-right:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px var(--green);
}

/* =========================================================
   CANVAS
========================================================= */

#earthCanvas{
    position:absolute;
    z-index:10;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}

/* =========================================================
   DECORATIVE ORBITS
========================================================= */

.orbit{
    position:absolute;
    z-index:5;

    left:50%;
    top:50%;

    width:min(78vw,650px);
    height:min(78vw,650px);

    transform:
        translate(-50%,-50%)
        rotate(-20deg);

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:50%;

    pointer-events:none;
}

.orbit::before{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    left:9%;
    top:15%;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 15px var(--cyan),
        0 0 30px rgba(0,234,255,.35);
}

.orbit::after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    right:14%;
    bottom:8%;

    border-radius:50%;

    background:var(--pink);

    box-shadow:
        0 0 13px var(--pink);
}

.orbit2{
    position:absolute;
    z-index:5;

    left:50%;
    top:50%;

    width:min(88vw,720px);
    height:min(45vw,350px);

    transform:
        translate(-50%,-50%)
        rotate(23deg);

    border:
        1px dashed
        rgba(155,92,255,.18);

    border-radius:50%;

    pointer-events:none;
}

/* =========================================================
   RIGHT CONTROLS
========================================================= */

.controls{
    position:absolute;
    z-index:90;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    display:flex;
    flex-direction:column;

    gap:8px;
}

.controlButton{
    width:45px;
    height:45px;

    border-radius:14px;

    border:
        1.5px solid
        rgba(255,255,255,.87);

    background:
        rgba(2,8,18,.72);

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 15px rgba(0,234,255,.06);

    font-size:20px;

    transition:
        transform .15s ease,
        background .15s ease;
}

.controlButton:active{
    transform:scale(.90);
    background:rgba(255,255,255,.10);
}

/* =========================================================
   BOTTOM HUD
========================================================= */

.bottomHud{
    position:absolute;
    z-index:70;

    left:10px;
    right:10px;
    bottom:10px;

    display:flex;
    justify-content:center;

    pointer-events:none;
}

.bottomBox{
    width:min(720px,100%);

    padding:
        10px
        14px;

    text-align:center;

    border-radius:19px;

    border:
        1.4px solid
        rgba(255,255,255,.88);

    background:
        linear-gradient(
            100deg,
            rgba(0,234,255,.08),
            rgba(35,139,255,.08),
            rgba(155,92,255,.09),
            rgba(255,79,216,.07),
            rgba(54,241,161,.06)
        ),
        rgba(2,8,18,.78);

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 25px rgba(0,234,255,.07),
        inset 0 0 18px rgba(255,255,255,.025);
}

.bottomTitle{
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
}

.bottomText{
    margin-top:4px;

    color:#8e9db2;

    font-size:8px;
    letter-spacing:1px;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
    position:absolute;
    z-index:200;

    top:84px;

    width:min(390px,calc(100% - 22px));

    max-height:
        calc(100% - 98px);

    overflow:auto;

    padding:15px;

    border-radius:23px;

    border:
        1.5px solid
        rgba(255,255,255,.90);

    background:
        linear-gradient(
            145deg,
            rgba(0,234,255,.07),
            rgba(35,139,255,.07),
            rgba(155,92,255,.09),
            rgba(255,79,216,.06)
        ),
        rgba(2,7,17,.94);

    backdrop-filter:blur(24px);

    box-shadow:
        0 0 35px rgba(0,234,255,.10);

    transition:
        transform .34s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;
}

.searchPanel{
    right:11px;
    transform:translateX(120%);
    opacity:0;
}

.menuPanel{
    left:11px;
    transform:translateX(-120%);
    opacity:0;
}

.panel.open{
    transform:translateX(0);
    opacity:1;
}

.panelHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:13px;
}

.panelHeader h2{
    font-size:17px;
    letter-spacing:.3px;
}

.closeButton{
    width:35px;
    height:35px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.30);

    background:
        rgba(255,255,255,.055);

    font-size:20px;
}

/* =========================================================
   SEARCH
========================================================= */

.searchRow{
    display:flex;
    gap:7px;
}

.searchInput{
    flex:1;
    min-width:0;

    height:45px;

    padding:
        0
        13px;

    border-radius:13px;

    outline:none;

    border:
        1px solid
        rgba(255,255,255,.27);

    background:
        rgba(255,255,255,.055);

    color:white;

    font-size:12px;
}

.searchInput::placeholder{
    color:#718096;
}

.searchButton{
    width:48px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.75);

    background:
        linear-gradient(
            135deg,
            rgba(0,234,255,.22),
            rgba(35,139,255,.19),
            rgba(155,92,255,.23)
        );

    font-size:17px;
}

.searchHint{
    margin-top:9px;

    color:#718096;

    font-size:9px;
}

.searchResult{
    margin-top:8px;

    padding:11px 12px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:
        rgba(255,255,255,.04);

    transition:
        background .15s ease,
        transform .15s ease;
}

.searchResult:active{
    transform:scale(.98);
    background:rgba(255,255,255,.08);
}

.searchResult strong{
    display:block;
    font-size:11px;
}

.searchResult small{
    display:block;

    margin-top:4px;

    color:#8494a9;

    font-size:8px;
}

/* =========================================================
   MENU
========================================================= */

.menuItem{
    width:100%;

    display:block;

    text-align:left;

    margin-top:8px;

    padding:13px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.045);

    transition:
        transform .15s ease,
        background .15s ease;
}

.menuItem:active{
    transform:scale(.98);
    background:rgba(255,255,255,.08);
}

.menuItem strong{
    display:block;
    font-size:12px;
}

.menuItem span{
    display:block;

    margin-top:4px;

    color:#8190a5;

    font-size:8px;

    line-height:1.5;
}

/* =========================================================
   INFORMATION CARD
========================================================= */

.infoCard{
    position:absolute;
    z-index:150;

    left:50%;
    bottom:83px;

    width:min(380px,calc(100% - 24px));

    transform:
        translate(-50%,25px);

    opacity:0;

    pointer-events:none;

    padding:14px;

    border-radius:19px;

    border:
        1.5px solid
        rgba(255,255,255,.88);

    background:
        rgba(2,8,18,.91);

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 30px rgba(0,234,255,.09);

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.infoCard.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

.infoCard h3{
    font-size:14px;
}

.infoCard p{
    margin-top:6px;

    color:#99a8ba;

    font-size:9px;

    line-height:1.55;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;
    z-index:300;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #071a31,
            #010208 70%
        );

    transition:
        opacity .6s ease,
        visibility .6s ease;
}

.loading.hidden{
    opacity:0;
    visibility:hidden;
}

.loadingBox{
    text-align:center;
}

.loadingPlanet{
    width:74px;
    height:74px;

    margin:auto;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.8);

    background:
        radial-gradient(
            circle at 35% 30%,
            #51edff,
            #0c8fe0 38%,
            #02345e 78%,
            #010b19
        );

    box-shadow:
        0 0 25px rgba(0,234,255,.25);

    animation:
        loadingSpin 1.5s linear infinite;
}

@keyframes loadingSpin{
    to{
        transform:rotate(360deg);
    }
}

.loadingText{
    margin-top:15px;

    font-size:10px;
    letter-spacing:2px;

    color:#a9b8cb;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .topbar{
        height:69px;
        padding:10px 10px;
    }

    .brandLogo{
        width:42px;
        height:42px;
        border-radius:13px;
    }

    .brandLogo span{
        font-size:20px;
    }

    .brandTitle{
        font-size:13px;
        letter-spacing:2px;
    }

    .brandSub{
        font-size:7px;
    }

    .topButton{
        width:41px;
        height:41px;
        border-radius:12px;
    }

    .status{
        top:76px;
        font-size:7px;
    }

    .controls{
        right:8px;
    }

    .controlButton{
        width:41px;
        height:41px;
        border-radius:13px;
    }

    .bottomBox{
        padding:9px 11px;
        border-radius:17px;
    }

    .bottomTitle{
        font-size:9px;
    }

    .bottomText{
        font-size:7px;
    }
}

@media(max-height:610px){

    .bottomHud{
        display:none;
    }

    .infoCard{
        bottom:12px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- BACKGROUND -->
    <div class="background">
        <div class="starLayer"></div>
        <div class="nebula"></div>
    </div>


    <!-- TOP BAR -->
    <header class="topbar">

        <div class="brand">

            <div class="brandLogo">
                <span>🌍</span>

            <div>

    </div>

    <!-- EARTH -->
    <canvas id="earthCanvas"></canvas>


    <!-- RIGHT CONTROLS -->

            id="zoomIn"
            aria-label="Zoom in">

            id="resetEarth"
            aria-label="Reset">

            class="controlButton"
            id="zoomOut"
            aria-label="Zoom out">

        </button>

    <!-- INFO CARD -->

        <h3 id="infoTitle">
            🌍 Earth
        </h3>

        <p id="infoText">

        </p>

    </div>


    <!-- BOTTOM -->
    <div class="bottomHud">

        <div class="bottomBox">

            <div class="bottomTitle">
                🌐 EXPLORE PLANET EARTH
            </div>

            <div class="bottomText">

        </div>

    <section

            </div>

<script>
"use strict";

/* =========================================================
   M POPAL EARTH 360°
   COMPLETE SINGLE-FILE ENGINE
========================================================= */

const canvas =
    document.getElementById("earthCanvas");

const ctx =
    canvas.getContext("2d", {
        alpha:true
    });


/* =========================================================
   GLOBAL SIZE
========================================================= */

let W = window.innerWidth;
let H = window.innerHeight;

let DPR =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );


function resizeCanvas(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   EARTH STATE
========================================================= */

const earth = {

    longitude:-25,

    latitude:8,

    targetLongitude:-25,

    targetLatitude:8,

    zoom:1,

    targetZoom:1,

/* =========================================================
   MATH
========================================================= */

function radians(value){

    return value * Math.PI / 180;

}


function normalizeLongitude(value){

    while(value > 180){
        value -= 360;
    }

    while(value < -180){
        value += 360;
    }

    return value;
}


/* =========================================================
   GLOBE RADIUS
========================================================= */

function getRadius(){

    let r =
        Math.min(W,H) * .335;

    if(W < 500){

        r =
            Math.min(W,H) * .365;

    }

    return r * earth.zoom;
}


/* =========================================================
   PROJECTION
========================================================= */

function project(
    longitude,
    latitude,
    radius,
    centerX,
    centerY
){

    const L =
        radians(
            normalizeLongitude(
                longitude -
                earth.longitude
            )
        );

    const P =
        radians(latitude);

    const C =
        radians(earth.latitude);


    const x =
        Math.cos(P) *
        Math.sin(L);


    const y =
        Math.cos(C) *
        Math.sin(P)
        -
        Math.sin(C) *
        Math.cos(P) *
        Math.cos(L);


    const z =
        Math.sin(C) *
        Math.sin(P)
        +
        Math.cos(C) *
        Math.cos(P) *
        Math.cos(L);


    return{

        x:centerX + x * radius,

        y:centerY - y * radius,

        z:z

    };

}


/* =========================================================
   BACK GLOW
========================================================= */

function drawEarthGlow(
    centerX,
    centerY,
    radius
){

    const glow =
        ctx.createRadialGradient(
            centerX,
            centerY,
            radius*.65,
            centerX,
            centerY,
            radius*1.30
        );


    glow.addColorStop(
        0,
        "rgba(0,234,255,.16)"
    );

    glow.addColorStop(
        .45,
        "rgba(35,139,255,.07)"
    );

    glow.addColorStop(
        .75,
        "rgba(155,92,255,.035)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius*1.30,
        0,
        Math.PI*2
    );

    ctx.fillStyle=glow;

    ctx.fill();

}


/* =========================================================
   SPHERE
========================================================= */

function drawSphere(
    centerX,
    centerY,
    radius
){

    const sphere =
        ctx.createRadialGradient(
            centerX-radius*.38,
            centerY-radius*.45,
            radius*.02,
            centerX,
            centerY,
            radius
        );


    sphere.addColorStop(
        0,
        "#55edff"
    );

    sphere.addColorStop(
        .18,
        "#20c6f4"
    );

    sphere.addColorStop(
        .43,
        "#087fc8"
    );

    sphere.addColorStop(
        .70,
        "#04528f"
    );

    sphere.addColorStop(
        .88,
        "#022f59"
    );

    sphere.addColorStop(
        1,
        "#010f24"
    );


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle=sphere;

    ctx.fill();


    /* bright atmospheric reflection */

    const shine =
        ctx.createRadialGradient(
            centerX-radius*.43,
            centerY-radius*.47,
            0,
            centerX-radius*.20,
            centerY-radius*.18,
            radius
        );


    shine.addColorStop(
        0,
        "rgba(255,255,255,.26)"
    );

    shine.addColorStop(
        .27,
        "rgba(255,255,255,.055)"
    );

    shine.addColorStop(

    );


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle=shine;

    ctx.fill();

}


/* =========================================================
   CLIP TO EARTH
========================================================= */

function clipEarth(
    centerX,
    centerY,
    radius
){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI*2
    );

    ctx.clip();

}


/* =========================================================
   GRID
========================================================= */

function drawGrid(
    centerX,
    centerY,
    radius
){

    clipEarth(
        centerX,
        centerY,
        radius
    );


    ctx.lineWidth=.48;

    ctx.strokeStyle=
        "rgba(255,255,255,.35)";


    /* LATITUDE */

    for(
        let latitude=-80;
        latitude<=80;
        latitude+=10
    ){

        let started=false;

        ctx.beginPath();


        for(
            let longitude=-180;
            longitude<=180;
            longitude+=2
        ){

            const p =
                project(
                    longitude,
                    latitude,
                    radius,
                    centerX,
                    centerY
                );


            if(p.z > 0){

                if(!started){

                    ctx.moveTo(
                        p.x,
                        p.y
                    );

                    started=true;

                }else{

                    ctx.lineTo(
                        p.x,
                        p.y
                    );

                }

            }else{

                started=false;

            }

        }


        ctx.stroke();

    }


    /* LONGITUDE */

    for(
        let longitude=-180;
        longitude<180;
        longitude+=10
    ){

        let started=false;

        ctx.beginPath();


        for(
            let latitude=-90;
            latitude<=90;
            latitude+=2
        ){

            const p =
                project(
                    longitude,
                    latitude,
                    radius,
                    centerX,
                    centerY
                );


            if(p.z > 0){

                if(!started){

                    ctx.moveTo(
                        p.x,
                        p.y
                    );

                    started=true;

                }else{

                    ctx.lineTo(
                        p.x,
                        p.y
                    );

                }

            }else{

                started=false;

            }

        }


        ctx.stroke();

    }


    /* EQUATOR */

    ctx.strokeStyle=
        "rgba(54,241,161,.58)";

    ctx.lineWidth=.75;


    let started=false;

    ctx.beginPath();


    for(
        let longitude=-180;
        longitude<=180;
        longitude+=2
    ){

        const p =
            project(
                longitude,
                0,
                radius,
                centerX,
                centerY
            );


        if(p.z>0){

            if(!started){

                ctx.moveTo(
                    p.x,
                    p.y
                );

                started=true;

            }else{

                ctx.lineTo(
                    p.x,
                    p.y
                );

            }

        }else{

            started=false;

        }

    }


    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   CONTINENTS
========================================================= */

function drawContinents(
    centerX,
    centerY,
    radius
){

    clipEarth(
        centerX,
        centerY,
        radius
    );


    continents.forEach(
        continent=>{

            ctx.beginPath();

            let first=true;


            continent.points.forEach(
                point=>{

                    const p =
                        project(
                            point[0],
                            point[1],
                            radius,
                            centerX,
                            centerY
                        );


                    if(p.z > 0){

                        if(first){

                            ctx.moveTo(
                                p.x,
                                p.y
                            );

                            first=false;

                        }else{

                            ctx.lineTo(
                                p.x,
                                p.y
                            );

                        }

                    }

                }
            );


            ctx.closePath();


            ctx.fillStyle=
                "rgba(2,25,45,.84)";

            ctx.fill();


            ctx.strokeStyle=
                "rgba(255,255,255,.92)";

            ctx.lineWidth=1.05;

            ctx.stroke();

        }
    );


    ctx.restore();

}

/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const centerX =
        W/2;

    const centerY =
        H/2 + 5;

    const radius =
        getRadius();


    drawEarthGlow(
        centerX,
        centerY,
        radius
    );


    drawSphere(
        centerX,
        centerY,
        radius
    );


    drawGrid(
        centerX,
        centerY,
        radius
    );


    drawContinents(
        centerX,
        centerY,
        radius
    );


    /* map lines over land */

    drawGrid(
        centerX,
        centerY,
        radius
    );


    drawCountryNames(
        centerX,
        centerY,
        radius
    );


    drawContinentNames(
        centerX,
        centerY,
        radius
    );


    drawPlaces(
        centerX,
        centerY,
        radius
    );


    drawCenterIndicator(
        centerX,
        centerY
    );


    drawEarthEdge(
        centerX,
        centerY,
        radius
    );


    requestAnimationFrame(
        render
    );

}


/* =========================================================
   SMOOTH EARTH ANIMATION
========================================================= */

function animateEarth(){

    if(
        !earth.dragging &&
        earth.autoRotate
    ){

        earth.targetLongitude +=
            earth.velocity;

    }


    earth.longitude +=
        (
            earth.targetLongitude -
            earth.longitude
        ) * .095;


    earth.latitude +=
        (
            earth.targetLatitude -
            earth.latitude
        ) * .095;


    earth.zoom +=
        (
            earth.targetZoom -
            earth.zoom
        ) * .10;


    requestAnimationFrame(
        animateEarth
    );

}


render();
animateEarth();


/* =========================================================
   MOUSE DRAG
========================================================= */

canvas.addEventListener(
    "mousedown",
    function(event){

        earth.dragging=true;

        earth.autoRotate=false;

        earth.lastX=
            event.clientX;

        earth.lastY=
            event.clientY;

    }
);


window.addEventListener(
    "mousemove",
    function(event){

        if(!earth.dragging){
            return;
        }


        const dx =
            event.clientX -
            earth.lastX;


        const dy =
            event.clientY -
            earth.lastY;


        earth.targetLongitude -=
            dx*.32;


        earth.targetLatitude +=
            dy*.22;


        earth.targetLatitude =
            Math.max(
                -78,
                Math.min(
                    78,
                    earth.targetLatitude
                )
            );


        earth.lastX=
            event.clientX;

        earth.lastY=
            event.clientY;

    }
);


window.addEventListener(
    "mouseup",
    function(){

        earth.dragging=false;

        setTimeout(
            function(){

                earth.autoRotate=true;

            },
            1000
        );

    }
);


/* =========================================================
   TOUCH
========================================================= */

let touchDrag=false;

let pinchStartDistance=0;

let pinchStartZoom=1;


function getTouchDistance(
    a,
    b
){

    const dx =
        a.clientX -
        b.clientX;

    const dy =
        a.clientY -
        b.clientY;

    return Math.sqrt(
        dx*dx + dy*dy
    );

}


canvas.addEventListener(
    "touchstart",
    function(event){

        event.preventDefault();


        if(
            event.touches.length===1
        ){

            touchDrag=true;

            earth.dragging=true;

            earth.autoRotate=false;


            earth.lastX=
                event.touches[0].clientX;

            earth.lastY=
                event.touches[0].clientY;

        }


        if(
            event.touches.length===2
        ){

            touchDrag=false;

            earth.dragging=false;


            pinchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pinchStartZoom =
                earth.targetZoom;

        }

    },
    {
        passive:false
    }
);


canvas.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();


        if(
            event.touches.length===1 &&
            touchDrag
        ){

            const x =
                event.touches[0].clientX;

            const y =
                event.touches[0].clientY;


            const dx =
                x-earth.lastX;

            const dy =
                y-earth.lastY;


            earth.targetLongitude -=
                dx*.32;


            earth.targetLatitude +=
                dy*.22;


            earth.targetLatitude =
                Math.max(
                    -78,
                    Math.min(
                        78,
                        earth.targetLatitude
                    )
                );


            earth.lastX=x;
            earth.lastY=y;

        }


        if(
            event.touches.length===2
        ){

            const currentDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            const ratio =
                currentDistance /
                Math.max(
                    1,
                    pinchStartDistance
                );


            earth.targetZoom =
                pinchStartZoom *
                ratio;


            earth.targetZoom =
                Math.max(
                    .68,
                    Math.min(
                        1.75,
                        earth.targetZoom
                    )
                );

        }

    },
    {
        passive:false
    }
);


canvas.addEventListener(
    "touchend",
    function(){

        earth.dragging=false;

        touchDrag=false;


        setTimeout(
            function(){

                earth.autoRotate=true;

            },
            1000
        );

    }
);


/* =========================================================
   WHEEL ZOOM
========================================================= */

canvas.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();


        if(event.deltaY < 0){

            earth.targetZoom += .09;

        }else{

            earth.targetZoom -= .09;

        }


        earth.targetZoom =
            Math.max(
                .68,
                Math.min(
                    1.75,
                    earth.targetZoom
                )
            );

    },
    {
        passive:false
    }
);


/* =========================================================
   BUTTON ZOOM
========================================================= */

document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        function(){

            earth.targetZoom =
                Math.min(
                    1.75,
                    earth.targetZoom+.15
                );

        }
    );


document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        function(){

            earth.targetZoom =
                Math.max(
                    .68,
                    earth.targetZoom-.15
                );

        }
    );


document
    .getElementById("resetEarth")
    .addEventListener(
        "click",
        function(){

            earth.targetLongitude=-25;

            earth.targetLatitude=8;

            earth.targetZoom=1;

            showInfo(
                "🌍 Earth Reset",
                "The Earth view has been returned to its original position."
            );

        }
    );

/* =========================================================
   SEARCH
========================================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );


function performSearch(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    if(!query){

        searchResults.innerHTML=
            '<div class="searchResult">'+
            '<strong>🌍 Explore Earth</strong>'+
            '<small>'+
            'Search for a country, continent or important place.'+
            '</small>'+
            '</div>';

        return;

    }


    const found =
        database.filter(
            item=>{

                return (
                    item.name
                        .toLowerCase()
                        .includes(query)
                    ||
                    item.type
                        .toLowerCase()
                        .includes(query)
                    ||
                    (
                        item.extra || ""
                    )
                        .toLowerCase()
                        .includes(query)
                );

            }
        );


    searchResults.innerHTML="";


    if(found.length===0){

        searchResults.innerHTML=
            '<div class="searchResult">'+
            '<strong>❌ No result</strong>'+
            '<small>'+
            'Try another country, city or continent.'+
            '</small>'+
            '</div>';

        return;

    }


    found
        .slice(0,12)
        .forEach(
            item=>{

                const result =
                    document.createElement(
                        "div"
                    );


                result.className=
                    "searchResult";


                result.innerHTML=
                    "<strong>"+
                    item.name+
                    "</strong>"+
                    "<small>"+
                    item.type+
                    (
                        item.extra
                        ?
                        " • "+item.extra
                        :
                        ""
                    )+
                    "</small>";


                result.addEventListener(
                    "click",
                    function(){

                        if(
                            typeof item.lon ===
                            "number"
                        ){

                            earth.targetLongitude =
                                item.lon;

                            earth.targetLatitude =
                                item.lat;

                            earth.targetZoom =
                                Math.max(
                                    1.08,
                                    earth.targetZoom
                                );


                            showInfo(
                                "📍 "+item.name,
                                item.type+
                                (
                                    item.extra
                                    ?
                                    " • "+
                                    item.extra
                                    :
                                    ""
                                )
                            );

                        }else{

                            showInfo(
                                "🌎 "+item.name,
                                "Major geographical region."
                            );

                        }


                        closePanels();

                    }
                );


                searchResults.appendChild(
                    result
                );

            }
        );

}


document
    .getElementById("searchButton")
    .addEventListener(
        "click",
        performSearch
    );


searchInput.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            performSearch();

        }

    }
);


/* =========================================================
   INFO CARD
========================================================= */

const infoCard =
    document.getElementById(
        "infoCard"
    );

const infoTitle =
    document.getElementById(
        "infoTitle"
    );

const infoText =
    document.getElementById(
        "infoText"
    );

let infoTimer;


function showInfo(
    title,
    text
){

    infoTitle.textContent =
        title;

    infoText.textContent =
        text;

    infoCard.classList.add(
        "show"
    );


    clearTimeout(
        infoTimer
    );


    infoTimer =
        setTimeout(
            function(){

                infoCard.classList.remove(
                    "show"
                );

            },
            5000
        );

}


/* =========================================================
   MENU ACTIONS
========================================================= */

document
    .querySelectorAll(".menuItem")
    .forEach(
        item=>{

            item.addEventListener(
                "click",
                function(){

                    const action =
                        item.dataset.action;


                    if(
                        action==="continents"
                    ){

                        showInfo(
                            "🌎 Seven Continents",
                            "Africa • Antarctica • Asia • Europe • North America • South America • Australia/Oceania."
                        );

                    }


                    if(
                        action==="countries"
                    ){

                        showInfo(
                            "🗺️ Countries",
                            "Major country names are displayed across the globe and can also be found through Search."
                        );

                    }


                    if(
                        action==="places"
                    ){

                        showInfo(
                            "📍 Important Places",
                            "Kabul • Kandahar • Tokyo • Beijing • Delhi • Dubai • Mecca • Cairo • London • Paris • New York • Sydney and more."
                        );

                    }


                    if(
                        action==="controls"
                    ){

                        showInfo(
                            "👆 Earth Controls",
                            "Drag with one finger or mouse to rotate. Use two fingers to pinch zoom. The + and − buttons also control zoom."
                        );

                    }


                    if(
                        action==="about"
                    ){

                        showInfo(
                            "✨ M POPAL EARTH 360°",
                            "A standalone Canvas Earth explorer. No Three.js, no WebGL, no CDN and no external files are required."
                        );

                    }


                    menuPanel.classList.remove(
                        "open"
                    );

                }
            );

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Escape"){

            closePanels();

            infoCard.classList.remove(
                "show"
            );

        }


        if(event.key==="+"){

            earth.targetZoom =
                Math.min(
                    1.75,
                    earth.targetZoom+.10
                );

        }


        if(event.key==="-"){

            earth.targetZoom =
                Math.max(
                    .68,
                    earth.targetZoom-.10
                );

        }


        if(event.key==="ArrowLeft"){

            earth.targetLongitude-=5;

        }


        if(event.key==="ArrowRight"){

            earth.targetLongitude+=5;

        }


        if(event.key==="ArrowUp"){

            earth.targetLatitude =
                Math.min(
                    78,
                    earth.targetLatitude+4
                );

        }


        if(event.key==="ArrowDown"){

            earth.targetLatitude =
                Math.max(
                    -78,
                    earth.targetLatitude-4
                );

        }

    }
);

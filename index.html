<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#02040a">
<title>M POPAL • EARTH 360°</title>

<style>
/* =========================================================
   M POPAL EARTH 360
   ONE-FILE EDITION
   No external library
   No CDN
   No extra file
   ========================================================= */

:root{
    --bg:#02040a;
    --bg2:#07101d;
    --cyan:#00eaff;
    --blue:#4285ff;
    --violet:#a855f7;
    --green:#36f1a1;
    --gold:#ffd166;
    --pink:#ff4fd8;
    --white:#ffffff;
    --muted:#aebbd0;
    --glass:rgba(9,18,32,.72);
    --glass2:rgba(255,255,255,.075);
    --edge:rgba(255,255,255,.88);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:white;
    font-family:
        Inter,Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

button,input{
    font:inherit;
}

button{
    border:0;
    color:white;
    cursor:pointer;
}

/* =========================================================
   APP
   ========================================================= */

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 45%,
        rgba(0,234,255,.13),
        transparent 27%),
      radial-gradient(circle at 20% 80%,
        rgba(168,85,247,.10),
        transparent 28%),
      radial-gradient(circle at 85% 20%,
        rgba(54,241,161,.08),
        transparent 25%),
      #02040a;
}

/* =========================================================
   SPACE
   ========================================================= */

.space{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
      radial-gradient(circle,rgba(0,234,255,.7) 0 1px,transparent 1.5px),
      radial-gradient(circle,rgba(255,209,102,.65) 0 1px,transparent 1.5px);
    background-size:93px 93px,157px 157px,211px 211px;
    background-position:0 0,40px 80px,100px 30px;
    opacity:.5;
}

.nebula{
    position:absolute;
    width:70vmax;
    height:70vmax;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle,
        rgba(0,234,255,.10),
        rgba(66,133,255,.045) 30%,
        transparent 68%);
    filter:blur(25px);
    animation:nebula 8s ease-in-out infinite alternate;
}

@keyframes nebula{
    from{transform:translate(-50%,-50%) scale(.88)}
    to{transform:translate(-50%,-50%) scale(1.12)}
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 18px;
    pointer-events:none;
}

.brand{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:20px;
    font-weight:900;
    background:
      linear-gradient(135deg,
        rgba(0,234,255,.2),
        rgba(168,85,247,.25),
        rgba(255,79,216,.18));
    border:1.5px solid rgba(255,255,255,.88);
    box-shadow:
      0 0 18px rgba(0,234,255,.25),
      inset 0 0 15px rgba(255,255,255,.06);
}

.brandText strong{
    display:block;
    font-size:17px;
    letter-spacing:2px;
}

.brandText span{
    display:block;
    color:#a9b7cc;
    font-size:10px;
    margin-top:3px;
    letter-spacing:2px;
}

.headerActions{
    pointer-events:auto;
    display:flex;
    gap:9px;
}

.iconBtn{
    width:46px;
    height:46px;
    border-radius:15px;
    background:rgba(5,12,24,.68);
    border:1.5px solid rgba(255,255,255,.78);
    box-shadow:
      0 0 14px rgba(255,255,255,.05),
      inset 0 0 15px rgba(0,234,255,.04);
    font-size:20px;
    backdrop-filter:blur(12px);
}

.iconBtn:active{
    transform:scale(.94);
}

/* =========================================================
   GLOBE STAGE
   ========================================================= */

#globeStage{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
}

#globeCanvas{
    position:absolute;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

/* =========================================================
   GLOBE HUD
   ========================================================= */

.globeHUD{
    position:absolute;
    z-index:8;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,600px);
    height:min(92vw,600px);
    pointer-events:none;
}

.ring{
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
      0 0 25px rgba(0,234,255,.08),
      inset 0 0 25px rgba(168,85,247,.04);
}

.ring2{
    position:absolute;
    inset:-18px;
    border-radius:50%;
    border:1px dashed rgba(0,234,255,.15);
    animation:spin 22s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================================================
   STATUS
   ========================================================= */

.status{
    position:absolute;
    z-index:12;
    top:94px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:30px;
    background:rgba(2,7,15,.58);
    backdrop-filter:blur(12px);
    color:#d9e4f4;
    font-size:11px;
    letter-spacing:1px;
    white-space:nowrap;
}

.liveDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls{
    position:absolute;
    z-index:15;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:9px;
}

.controlBtn{
    width:48px;
    height:48px;
    border-radius:16px;
    background:rgba(4,11,22,.72);
    border:1.5px solid rgba(255,255,255,.82);
    backdrop-filter:blur(13px);
    box-shadow:
      0 0 15px rgba(0,234,255,.07);
    font-size:21px;
}

.controlBtn:active{
    transform:scale(.92);
}

/* =========================================================
   BOTTOM INFO
   ========================================================= */

.bottom{
    position:absolute;
    z-index:15;
    left:15px;
    right:15px;
    bottom:15px;
    display:flex;
    justify-content:center;
    pointer-events:none;
}

.infoBar{
    pointer-events:auto;
    width:min(720px,100%);
    padding:13px 15px;
    border-radius:22px;
    border:1.5px solid rgba(255,255,255,.84);
    background:
      linear-gradient(110deg,
        rgba(0,234,255,.08),
        rgba(168,85,247,.08),
        rgba(255,79,216,.06),
        rgba(54,241,161,.06)),
      rgba(3,9,19,.78);
    backdrop-filter:blur(18px);
    box-shadow:
      0 0 25px rgba(0,234,255,.08),
      inset 0 0 25px rgba(255,255,255,.025);
    text-align:center;
}

.infoTitle{
    font-size:14px;
    font-weight:800;
    letter-spacing:1px;
}

.infoText{
    margin-top:5px;
    color:#aab9cd;
    font-size:10px;
}

/* =========================================================
   SEARCH PANEL
   ========================================================= */

.panel{
    position:absolute;
    z-index:50;
    top:88px;
    right:15px;
    width:min(390px,calc(100% - 30px));
    max-height:calc(100% - 110px);
    overflow:auto;
    border-radius:25px;
    border:1.5px solid rgba(255,255,255,.86);
    background:
      linear-gradient(145deg,
        rgba(0,234,255,.08),
        rgba(168,85,247,.08),
        rgba(255,79,216,.05)),
      rgba(3,9,19,.91);
    backdrop-filter:blur(22px);
    box-shadow:
      0 0 35px rgba(0,234,255,.12);
    padding:16px;
    transform:translateX(120%);
    transition:transform .32s ease;
}

.panel.open{
    transform:translateX(0);
}

.panelTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.panelTitle h2{
    font-size:18px;
}

.closeBtn{
    width:36px;
    height:36px;
    border-radius:12px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.3);
}

.searchBox{
    display:flex;
    gap:8px;
    margin-bottom:13px;
}

#searchInput{
    min-width:0;
    flex:1;
    height:46px;
    padding:0 14px;
    border-radius:14px;
    outline:none;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.06);
    color:white;
}

#searchInput::placeholder{
    color:#8290a5;
}

.searchBtn{
    width:48px;
    border-radius:14px;
    background:
      linear-gradient(135deg,
        rgba(0,234,255,.25),
        rgba(168,85,247,.3));
    border:1px solid rgba(255,255,255,.7);
}

.result{
    padding:13px;
    border-radius:15px;
    margin-top:8px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
}

.result strong{
    display:block;
    font-size:13px;
}

.result span{
    display:block;
    color:#9eacc0;
    margin-top:4px;
    font-size:10px;
}

/* =========================================================
   MENU
   ========================================================= */

.menuPanel{
    position:absolute;
    z-index:51;
    top:88px;
    left:15px;
    width:min(330px,calc(100% - 30px));
    border-radius:25px;
    border:1.5px solid rgba(255,255,255,.86);
    background:
      linear-gradient(145deg,
        rgba(54,241,161,.07),
        rgba(66,133,255,.08),
        rgba(168,85,247,.08)),
      rgba(3,9,19,.92);
    backdrop-filter:blur(22px);
    box-shadow:
      0 0 35px rgba(66,133,255,.12);
    padding:16px;
    transform:translateX(-120%);
    transition:transform .32s ease;
}

.menuPanel.open{
    transform:translateX(0);
}

.menuItem{
    width:100%;
    padding:14px;
    margin-top:8px;
    text-align:left;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.12);
}

.menuItem strong{
    display:block;
    font-size:13px;
}

.menuItem span{
    display:block;
    margin-top:4px;
    color:#8e9db1;
    font-size:10px;
}

/* =========================================================
   LOCATION CARD
   ========================================================= */

.locationCard{
    position:absolute;
    z-index:30;
    left:50%;
    bottom:92px;
    transform:translateX(-50%) translateY(30px);
    width:min(370px,calc(100% - 30px));
    padding:15px;
    border-radius:21px;
    background:rgba(3,10,20,.87);
    border:1.5px solid rgba(255,255,255,.82);
    backdrop-filter:blur(18px);
    opacity:0;
    pointer-events:none;
    transition:.3s ease;
}

.locationCard.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.locationCard h3{
    font-size:15px;
}

.locationCard p{
    margin-top:5px;
    color:#9eacc0;
    font-size:10px;
    line-height:1.5;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    .header{
        height:72px;
        padding:11px 12px;
    }

    .logo{
        width:43px;
        height:43px;
        border-radius:13px;
    }

    .brandText strong{
        font-size:14px;
    }

    .brandText span{
        font-size:8px;
    }

    .iconBtn{
        width:42px;
        height:42px;
        border-radius:13px;
    }

    .status{
        top:79px;
        font-size:9px;
        padding:7px 11px;
    }

    .controls{
        right:11px;
        gap:7px;
    }

    .controlBtn{
        width:43px;
        height:43px;
        border-radius:14px;
    }

    .bottom{
        bottom:10px;
        left:10px;
        right:10px;
    }

    .infoBar{
        border-radius:18px;
        padding:11px;
    }

    .infoTitle{
        font-size:12px;
    }

    .infoText{
        font-size:9px;
    }
}

@media(max-height:650px){

    .bottom{
        display:none;
    }

    .locationCard{
        bottom:18px;
    }
}

/* =========================================================
   ACCESSIBILITY
   ========================================================= */

button:focus-visible,
input:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
}
</style>
</head>

<body>

<div id="app">

    <!-- HEADER -->

                class="iconBtn"

            </button>

    </section>


    <!-- MENU -->
    <section
        class="menuPanel"

        <div class="panelTitle">

            <h2>Earth Menu</h2>

            <button
                class="closeBtn"

                ×
            </button>

        </div>

        <button class="menuItem" data-action="continents">
            <strong>🌎 Continents</strong>

        </button>

        </button>

        <button class="menuItem" data-action="controls">

        </button>

        <button class="menuItem" data-action="about">

</div>

/* =========================================================
   M POPAL EARTH 360
   SELF-CONTAINED CANVAS ENGINE

"use strict";

/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("globeCanvas");

const ctx =
    canvas.getContext("2d", {
        alpha:true
    });

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GLOBE STATE
   ========================================================= */

    lon: -20,
    lat: 5,

    targetLon: -20,
    targetLat: 5,

    zoom: 1,

/* =========================================================

        name:"Pacific Ocean",
        type:"Ocean",
        extra:"Largest ocean on Earth"
    },

    {
        name:"Atlantic Ocean",
        type:"Ocean",
        extra:"Ocean between the Americas and Europe/Africa"
    },

    {
        name:"Indian Ocean",
        type:"Ocean",
        extra:"Ocean south of Asia"
    },

    {
        name:"Arctic Ocean",
        type:"Ocean",
        extra:"Northern polar ocean"
    }
];


/* =========================================================
   PROJECTION
   ========================================================= */

function deg(v){
    return v * Math.PI / 180;
}

function normalizeLon(lon){

    while(lon > 180)
        lon -= 360;

    while(lon < -180)
        lon += 360;

    return lon;
}

function project(
    lon,
    lat,
    radius,
    cx,
    cy
){

    const L =
        deg(
            normalizeLon(
                lon -
                globe.lon
            )
        );

    const P =
        deg(
            lat
        );

    const centerLat =
        deg(
            globe.lat
        );

    const x =
        Math.cos(P) *
        Math.sin(L);

    const y =
        Math.cos(centerLat) *
        Math.sin(P)
        -
        Math.sin(centerLat) *
        Math.cos(P) *
        Math.cos(L);

    const z =
        Math.sin(centerLat) *
        Math.sin(P)
        +
        Math.cos(centerLat) *
        Math.cos(P) *
        Math.cos(L);

    return {
        x:cx + x * radius,
        y:cy - y * radius,
        z:z
    };
}


/* =========================================================
   GLOBE SIZE
   ========================================================= */

function getRadius(){

    const base =
        Math.min(W,H) * .34;

    return Math.max(
        100,
        base * globe.zoom
    );
}


/* =========================================================
   DRAW SPHERE
   ========================================================= */

function drawSphere(
    cx,
    cy,
    r
){

    const gradient =
        ctx.createRadialGradient(
            cx-r*.35,
            cy-r*.42,
            r*.08,
            cx,
            cy,
            r
        );

    gradient.addColorStop(
        0,
        "#22dfff"
    );

    gradient.addColorStop(
        .32,
        "#0878c9"
    );

    gradient.addColorStop(
        .68,
        "#044b91"
    );

    gradient.addColorStop(
        1,
        "#01152f"
    );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        gradient;

    ctx.fill();


    /* inner shine */

    const shine =
        ctx.createRadialGradient(
            cx-r*.38,
            cy-r*.42,
            0,
            cx-r*.2,
            cy-r*.2,
            r*.95
        );

    shine.addColorStop(
        0,
        "rgba(255,255,255,.18)"
    );

    shine.addColorStop(
        .35,
        "rgba(255,255,255,.035)"
    );

    shine.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        shine;

    ctx.fill();


    /* atmosphere */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r+4,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "rgba(0,234,255,.8)";

    ctx.lineWidth=2;

    ctx.shadowBlur=16;

    ctx.shadowColor=
        "rgba(0,234,255,.8)";

    ctx.stroke();

    ctx.shadowBlur=0;
}


/* =========================================================
   CLIP TO GLOBE
   ========================================================= */

function clipGlobe(
    cx,
    cy,
    r
){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );

    ctx.clip();
}


/* =========================================================
   GRID
   ========================================================= */

function drawGrid(
    cx,
    cy,
    r
){

    clipGlobe(
        cx,
        cy,
        r
    );

    ctx.lineWidth=.65;
    ctx.strokeStyle=
        COLORS.grid;

    /* latitude */

    for(
        let lat=-80;
        lat<=80;
        lat+=20
    ){

        let started=false;

        ctx.beginPath();

        for(
            let lon=-180;
            lon<=180;
            lon+=3
        ){

            const p =
                project(
                    lon,
                    lat,
                    r,
                    cx,
                    cy
                );

            if(p.z>0){

                if(!started){
                    ctx.moveTo(
                        p.x,
                        p.y
                    );
                    started=true;
                }else{
                    ctx.lineTo(
                        p.x,
                        p.y
                    );
                }

            }else{

                started=false;

            }
        }

        ctx.stroke();
    }


    /* longitude */

    for(
        let lon=-180;
        lon<180;
        lon+=20
    ){

        let started=false;

        ctx.beginPath();

        for(
            let lat=-90;
            lat<=90;
            lat+=3
        ){

            const p =
                project(
                    lon,
                    lat,
                    r,
                    cx,
                    cy
                );

            if(p.z>0){

                if(!started){

                    ctx.moveTo(
                        p.x,
                        p.y
                    );

                    started=true;

                }else{

                    ctx.lineTo(
                        p.x,
                        p.y
                    );
                }

            }else{

                started=false;

            }
        }

        ctx.stroke();
    }


    /* equator */

    ctx.strokeStyle=
        "rgba(54,241,161,.65)";

    ctx.lineWidth=1;

    let started=false;

    ctx.beginPath();

    for(
        let lon=-180;
        lon<=180;
        lon+=2
    ){

        const p =
            project(
                lon,
                0,
                r,
                cx,
                cy
            );

        if(p.z>0){

            if(!started){

                ctx.moveTo(
                    p.x,
                    p.y
                );

                started=true;

            }else{

                ctx.lineTo(
                    p.x,
                    p.y
                );

            }

        }else{

            started=false;

        }
    }

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   DRAW CONTINENTS
   ========================================================= */

function drawContinents(
    cx,
    cy,
    r
){

    clipGlobe(
        cx,
        cy,
        r
    );

    for(
        const continent
        of continents
    ){

        ctx.beginPath();

        let visible=false;

        continent.points.forEach(
            ([lon,lat],i)=>{

                const p =
                    project(
                        lon,
                        lat,
                        r,
                        cx,
                        cy
                    );

                if(p.z>0){

                    if(!visible){

                        ctx.moveTo(
                            p.x,
                            p.y
                        );

                        visible=true;

                    }else{

                        ctx.lineTo(
                            p.x,
                            p.y
                        );

                    }

                }

            }
        );

        ctx.closePath();

        ctx.fillStyle=
            COLORS.land;

        ctx.fill();

        ctx.strokeStyle=
            COLORS.landEdge;

        ctx.lineWidth=1.05;

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   CONTINENT LABELS
   ========================================================= */

const continentLabels = [

    ["North America",-105,48],
    ["South America",-60,-15],
    ["Europe",15,52],
    ["Asia",95,38],
    ["Africa",15,5],
    ["Australia",133,-25]
];

function drawLabels(
    cx,
    cy,
    r
){

    clipGlobe(
        cx,
        cy,
        r
    );

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(
        const [name,lon,lat]
        of continentLabels
    ){

        const p =
            project(
                lon,
                lat,
                r,
                cx,
                cy
            );

        if(p.z>.15){

            const size =
                Math.max(
                    9,
                    Math.min(
                        14,
                        r*.032
                    )
                );

            ctx.font=
                "700 "+size+"px Arial";

            ctx.fillStyle=
                "rgba(255,255,255,.88)";

            ctx.shadowBlur=7;
            ctx.shadowColor=
                "rgba(0,0,0,.9)";

            ctx.fillText(
                name,
                p.x,
                p.y
            );

            ctx.shadowBlur=0;
        }
    }

    ctx.restore();
}


/* =========================================================
   PLACES
   ========================================================= */

function drawPlaces(
    cx,
    cy,
    r
){

    clipGlobe(
        cx,
        cy,
        r
    );

    for(
        const place of places
    ){

        const p =
            project(
                place.lon,
                place.lat,
                r,
                cx,
                cy
            );

        if(p.z>.15){

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                3.1,
                0,
                Math.PI*2
            );

            ctx.fillStyle=
                COLORS.city;

            ctx.shadowBlur=9;
            ctx.shadowColor=
                COLORS.city;

            ctx.fill();

            ctx.shadowBlur=0;

        }
    }

    ctx.restore();
}


/* =========================================================
   NORTH POLE / CENTER MARKER
   ========================================================= */

function drawCenterMarker(
    cx,
    cy
){

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(255,255,255,.95)";

    ctx.shadowBlur=12;

    ctx.shadowColor=
        "#00eaff";

    ctx.fill();

    ctx.shadowBlur=0;
}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const cx =
        W/2;

    const cy =
        H/2 + 10;

    const r =
        getRadius();


    /* outer shadow */

    const shadow =
        ctx.createRadialGradient(
            cx,
            cy,
            r*.75,
            cx,
            cy,
            r*1.18
        );

    shadow.addColorStop(
        0,
        "rgba(0,234,255,.13)"
    );

    shadow.addColorStop(
        .7,
        "rgba(0,234,255,.035)"
    );

    shadow.addColorStop(
        1,
        "rgba(0,234,255,0)"
    );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r*1.18,
        0,
        Math.PI*2
    );

    ctx.fillStyle=shadow;
    ctx.fill();


    drawSphere(
        cx,
        cy,
        r
    );

    drawGrid(
        cx,
        cy,
        r
    );

    drawContinents(
        cx,
        cy,
        r
    );

    drawGrid(
        cx,
        cy,
        r
    );

    drawLabels(
        cx,
        cy,
        r
    );

    drawPlaces(
        cx,
        cy,
        r
    );

    drawCenterMarker(
        cx,
        cy
    );


    /* outer white edge */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.92)";

    ctx.lineWidth=1.5;

    ctx.shadowBlur=8;

    ctx.shadowColor=
        "rgba(255,255,255,.35)";

    ctx.stroke();

    ctx.shadowBlur=0;


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   SMOOTH MOTION
   ========================================================= */

function update(){

    if(
        !globe.dragging &&
        globe.autoRotate
    ){

        globe.targetLon +=
            globe.velocityX;
    }

    globe.lon +=
        (globe.targetLon-globe.lon)
        * .12;

    globe.lat +=
        (globe.targetLat-globe.lat)
        * .12;

    globe.zoom +=
        (globe.targetZoom-globe.zoom)
        * .12;

    requestAnimationFrame(
        update
    );
}

update();
render();


/* =========================================================
   DRAG / TOUCH
   ========================================================= */

function startDrag(
    x,
    y
){

    globe.dragging=true;

    globe.lastX=x;
    globe.lastY=y;

    globe.autoRotate=false;
}

function moveDrag(
    x,
    y
){

    if(!globe.dragging)
        return;

    const dx =
        x-globe.lastX;

    const dy =
        y-globe.lastY;

    globe.targetLon -=
        dx * .32;

    globe.targetLat +=
        dy * .22;

    globe.targetLat =
        Math.max(
            -80,
            Math.min(
                80,
                globe.targetLat
            )
        );

    globe.velocityX =
        -dx*.015;

    globe.lastX=x;
    globe.lastY=y;
}

function endDrag(){

    globe.dragging=false;

    setTimeout(
        ()=>{
            globe.autoRotate=true;
        },
        1800
    );
}


/* mouse */

canvas.addEventListener(
    "mousedown",
    e=>{
        startDrag(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "mousemove",
    e=>{
        moveDrag(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "mouseup",
    endDrag
);


/* touch */

canvas.addEventListener(
    "touchstart",
    e=>{

        if(
            e.touches.length===1
        ){

            const t =
                e.touches[0];

            startDrag(
                t.clientX,
                t.clientY
            );

        }

    },
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        if(
            e.touches.length===1
        ){

            const t =
                e.touches[0];

            moveDrag(
                t.clientX,
                t.clientY
            );

        }

    },
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    endDrag
);


/* =========================================================
   PINCH ZOOM
   ========================================================= */

let pinchDistance=null;

function distance(a,b){

    const dx =
        a.clientX-b.clientX;

    const dy =
        a.clientY-b.clientY;

    return Math.sqrt(
        dx*dx+dy*dy
    );
}

canvas.addEventListener(
    "touchstart",
    e=>{

        if(
            e.touches.length===2
        ){

            pinchDistance =
                distance(
                    e.touches[0],
                    e.touches[1]
                );

            globe.dragging=false;

        }

    },
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    e=>{

        if(
            e.touches.length===2
        ){

            e.preventDefault();

            const d =
                distance(
                    e.touches[0],
                    e.touches[1]
                );

            if(
                pinchDistance
            ){

                const diff =
                    d-pinchedistanceSafe();

                globe.targetZoom +=
                    diff*.002;

                globe.targetZoom =
                    Math.max(
                        .72,
                        Math.min(
                            1.8,
                            globe.targetZoom
                        )
                    );
            }

            pinchDistance=d;
        }

    },
    {passive:false}
);

function pinchedistanceSafe(){

    return pinchDistance || 1;
}

canvas.addEventListener(
    "touchend",
    ()=>{
        pinchDistance=null;
    }
);


/* =========================================================
   WHEEL ZOOM
   ========================================================= */

canvas.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        globe.targetZoom +=
            e.deltaY < 0
            ? .08
            : -.08;

        globe.targetZoom =
            Math.max(
                .72,
                Math.min(
                    1.8,
                    globe.targetZoom
                )
            );

    },
    {passive:false}
);


/* =========================================================
   BUTTONS

document

);

document

/* =========================================================
   SEARCH
   ========================================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );

function performSearch(){

    const query =
        searchInput.value
        .trim()
        .toLowerCase();

    if(!query){

        searchResults.innerHTML=
            '<div class="result">'+
            '<strong>Try a search</strong>'+
            '<span>Example: Japan, Asia, Kabul, Tokyo...</span>'+
            '</div>';

        return;
    }

    const matches =
        searchDatabase.filter(
            item =>
                item.name
                .toLowerCase()
                .includes(query)
                ||
                item.type
                .toLowerCase()
                .includes(query)
                ||
                (item.extra||"")
                .toLowerCase()
                .includes(query)
        );

    if(!matches.length){

        searchResults.innerHTML=
            '<div class="result">'+
            '<strong>No result found</strong>'+
            '<span>Try another country, continent or place.</span>'+
            '</div>';

        return;
    }

    searchResults.innerHTML="";

    matches
    .slice(0,8)
    .forEach(
        item=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className="result";

            div.innerHTML=
                "<strong>"+
                item.name+
                "</strong>"+
                "<span>"+
                item.type+
                " • "+
                (item.extra||"")+
                "</span>";

            div.addEventListener(
                "click",
                ()=>{

                    if(
                        typeof item.lon===
                        "number"
                    ){

                        globe.targetLon =
                            item.lon;

                        globe.targetLat =
                            item.lat;

                        globe.targetZoom =
                            Math.max(
                                1,
                                globe.targetZoom
                            );

                        showLocation(
                            item.name,
                            item.type+
                            " • "+
                            (item.extra||"")
                        );

                    }else{

                        showLocation(
                            item.name,
                            item.extra||""
                        );

                    }

                    searchPanel.classList.remove(
                        "open"
                    );

                }
            );

            searchResults.appendChild(
                div
            );
        }
    );
}

document
.getElementById("searchButton")
.addEventListener(
    "click",
    performSearch
);

searchInput.addEventListener(

    e=>{

        if(
            e.key==="Enter"

);
